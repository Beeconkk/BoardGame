.szv span{font-size:9.5px;color:#7A6A55}.szv em{font-style:normal;font-family:var(--szmin);font-size:14px;color:var(--szink);font-weight:700}
.szv i{display:block;font-style:normal;font-size:9px;color:#fff;background:var(--szgold);padding:0 4px;border-radius:2px;margin-top:1px}
.szv small{font-size:9px;color:#5A4A35}
.szv i.opp{background:#7A6A55}
.szv.opp{opacity:.55;background:repeating-linear-gradient(135deg,#fff 0 6px,#F1EADB 6px 7px)}
.szri li.opp{color:#9A8A70}
.szv.shun{border-color:var(--szgold);box-shadow:inset 0 0 0 1px var(--szgold);background:#FFFBEF}
.szvt{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 8px;background:var(--szink);color:#F3E6C8;border-radius:3px;line-height:1.1}
.szvt b{font-family:var(--szmin);font-size:20px}.szvt small{font-size:8.5px}
/* 手番 */
.szsteps{display:flex;gap:3px;flex:none}
.szsteps span{flex:1;text-align:center;font-family:var(--szmin);font-size:10.5px;padding:3px 0;border-bottom:2px solid var(--szline);color:#9A8A70}
.szsteps span.done{color:#7A6A55;border-color:#B7A887}
.szsteps span.now{color:var(--szink);border-color:#B33A3A;font-weight:700}
.szguide{margin:0;font-size:12px;color:#4A3E2E;background:rgba(255,255,255,.7);padding:6px 10px;border-left:3px solid var(--szgold);flex:none;line-height:1.5}
.szbtns{display:flex;gap:6px;flex-wrap:wrap;flex:none}
.szb{flex:1;min-width:120px;padding:11px 8px;border-radius:3px;border:1px solid var(--szink);background:var(--szpaper);font-family:var(--szmin);font-weight:700;font-size:13.5px;color:var(--szink)}
.szb.go{background:var(--szink);color:#F3E6C8}
.szb:disabled{opacity:.35}
/* 手札 */
.szhand{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;flex:none}
.szc{position:relative;height:76px;border-radius:4px;background:linear-gradient(180deg,#fff,color-mix(in srgb,var(--sc) 9%,#fff));border:1px solid color-mix(in srgb,var(--sc) 55%,#fff);box-shadow:0 1px 0 rgba(43,36,32,.12),inset 0 0 0 3px #fff,inset 0 0 0 4px color-mix(in srgb,var(--sc) 30%,#fff);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;line-height:1}
.szc .szart{width:30px;height:30px}
.szc>b{font-family:var(--szmin);font-weight:700;font-size:15px;color:var(--sc)}
.szc.sel{transform:translateY(-5px);box-shadow:0 0 0 2px var(--szink),0 6px 12px rgba(43,36,32,.22)}
.szc.ng{opacity:.42}
.szlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.szlist.one{grid-template-columns:60px;justify-content:center}
/* 能力カード */
.szpl{display:flex;flex-direction:column;gap:5px}
.szpart{display:flex;align-items:flex-start;gap:8px;padding:7px 9px;background:#fff;border:1px solid var(--szline);border-radius:3px;text-align:left}
.szpart>div{flex:1;min-width:0}
.szpart small{display:flex;align-items:center;gap:6px;font-size:9.5px;color:#9A8A70}
.szpart b{display:block;font-family:var(--szmin);font-size:13.5px;font-weight:700}
.szpart p{margin:1px 0 0;font-size:11px;color:#4A3E2E;line-height:1.45}
.szpart.t-c{border-left:3px solid #2E4A7A}.szpart.t-e{border-left:3px solid #B33A3A}.szpart.t-o{border-left:3px solid #9A7420}
.szpart.used{opacity:.45}
.szpart.can{box-shadow:0 0 0 2px var(--szgold);background:#FFFBEF;cursor:pointer}
.szpart.far{opacity:.6}
.szcost{display:inline-flex;gap:3px;margin-left:auto}
.szcost i{display:inline-flex;align-items:center;gap:1px;font-style:normal;padding:0 4px 0 1px;border:1px solid var(--sc);border-radius:2px;background:#fff}
.szcost i b{font-family:var(--szmin);font-size:11px;color:var(--sc)}
.szmkt,.szmyp{flex:none;display:flex;flex-direction:column;gap:5px}
.szmkt h5,.szmyp h5,.szsub{margin:4px 0 0;font-family:var(--szmin);font-size:13px;display:flex;flex-direction:column}
.szmkt h5 small{font-family:inherit;font-size:10px;color:#9A8A70;font-weight:400}
.szcbs{display:flex;flex-direction:column;gap:5px}
.szcb{padding:8px 10px;border-radius:3px;border:1px solid var(--szgold);background:#FFF8E6;font-family:var(--szmin);font-weight:700;font-size:12.5px;color:#6A4A10}
.szcb.on{background:var(--szink);color:#F3E6C8;border-color:var(--szink)}
.szlog{list-style:none;margin:0;padding:6px 10px;background:rgba(255,255,255,.6);border:1px solid var(--szline);font-size:11px;color:#6A5A45;flex:none;line-height:1.5}
/* 選択・結果 */
.szask{position:fixed;inset:0;z-index:46;background:rgba(30,22,16,.5);display:grid;place-items:center;padding:16px}
.szaskin{width:min(100%,400px);background:var(--szpaper);border:1px solid var(--szink);box-shadow:0 0 0 4px var(--szpaper),0 0 0 5px var(--szline),0 10px 30px rgba(0,0,0,.3);padding:16px 14px;display:flex;flex-direction:column;gap:12px}
.szaskin>b{font-family:var(--szmin);font-size:14px;line-height:1.5}
.szend{position:fixed;inset:0;z-index:45;background:rgba(30,22,16,.55);overflow-y:auto;padding:calc(var(--safe-t) + 14px) 12px 20px}
.szendin{max-width:440px;margin:0 auto;background:var(--szpaper);border:1px solid var(--szink);box-shadow:0 0 0 4px var(--szpaper),0 0 0 5px var(--szline);padding:14px 12px;display:flex;flex-direction:column;gap:8px}
.szendt{font-family:var(--szmin);font-weight:700;font-size:26px;letter-spacing:.2em;text-align:center;display:flex;flex-direction:column;gap:2px}
.szendt small{font-size:11px;letter-spacing:0;color:#7A6A55;font-weight:400}
.szres{background:#fff;border:1px solid var(--szline);border-left:4px solid var(--pc);border-radius:3px;padding:7px 9px}
.szres.win{border-color:var(--szgold);box-shadow:0 0 0 1px var(--szgold);background:#FFFBEF}
.szrh{display:flex;align-items:center;gap:6px}
.szrk{font-family:var(--szmin);font-weight:700;font-size:16px;width:22px;text-align:center}
.szres.win .szrk{color:#B33A3A}
.szrh b{font-size:14px}
.szpt{margin-left:auto;font-family:var(--szmin);font-weight:700;font-size:24px}.szpt small{font-size:11px}
.szri{list-style:none;margin:4px 0 0;padding:0;font-size:11px}
.szri li{display:flex;justify-content:space-between;gap:6px;border-top:1px dotted var(--szline);padding:2px 0}
.szri b{font-family:var(--szmin)}
.szm{display:inline-flex;align-items:center;gap:2px;font-size:10px;padding:1px 5px;border:1px solid var(--sc);color:var(--sc);border-radius:2px;background:#fff}
.sznote{margin:0;font-size:11px;color:#8A7A60}
.szfx{position:fixed;left:50%;top:38%;z-index:47;transform:translateX(-50%);padding:10px 22px;background:var(--szpaper);color:var(--szink);border:1px solid var(--szink);box-shadow:0 0 0 3px var(--szpaper),0 0 0 4px var(--szline),0 8px 22px rgba(0,0,0,.25);font-family:var(--szmin);font-weight:700;font-size:15px;white-space:nowrap;pointer-events:none;animation:szfx 2.2s ease both}
.szfx.adv{color:#B33A3A}.szfx.cal{font-size:22px;letter-spacing:.25em;color:#B33A3A}.szfx.back{color:#46679A}.szfx.combo{color:#2E4A7A}
@keyframes szfx{0%{opacity:0;transform:translateX(-50%) translateY(8px)}12%{opacity:1;transform:translateX(-50%)}80%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-14px)}}
.szloglist{list-style:none;margin:0;padding:0;font-size:12px}.szloglist li{padding:3px 0;border-bottom:1px dotted #D9CDB4}
.gic.szi{background:#FBF6EA}
.szpilel{font-family:var(--szmin);font-size:10px;color:#9A8A70;margin-right:2px}
/* ===== 四季の巡り v287：金箔と四季の装い ===== */
.arena.szg{--szt:#F7E9EE;--szt2:#F3DCE4;--szacc:#C9577E;transition:background-color .8s;
  background:radial-gradient(circle at 0 100%,transparent 18px,rgba(43,36,32,.04) 19px,transparent 20px) 0 0/40px 20px,radial-gradient(circle at 20px 100%,transparent 18px,rgba(43,36,32,.04) 19px,transparent 20px) 0 10px/40px 20px,
  radial-gradient(120% 60% at 100% 0,color-mix(in srgb,var(--szacc) 22%,transparent),transparent 60%),radial-gradient(90% 50% at 0 100%,color-mix(in srgb,var(--szacc) 16%,transparent),transparent 65%),linear-gradient(175deg,#FFFCF5,var(--szt) 55%,var(--szt2))}
.arena.szg[data-season=sum]{--szt:#E6F2EC;--szt2:#D5EAE1;--szacc:#2F7D6B}
.arena.szg[data-season=aut]{--szt:#F8E9DC;--szt2:#F1D7C1;--szacc:#B85A23}
.arena.szg[data-season=win]{--szt:#E9EEF6;--szt2:#D9E1EE;--szacc:#46679A}
/* 題字：金箔のきらめき */
.sztop{border-bottom:0;padding-bottom:8px;background:linear-gradient(90deg,transparent,var(--szgold),transparent) bottom/100% 1px no-repeat}
.szlogo{font-size:23px;letter-spacing:.22em;background:linear-gradient(100deg,#6E4C12 0%,#C99A3C 30%,#FFF1C4 45%,#C99A3C 60%,#6E4C12 100%) 0 0/250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:szshine 5s linear infinite;filter:drop-shadow(0 1px 0 rgba(255,255,255,.7))}
@keyframes szshine{from{background-position:120% 0}to{background-position:-130% 0}}
.szbtn{border-color:var(--szgold);background:linear-gradient(180deg,#FFFDF6,#F5EBD3);box-shadow:0 1px 3px rgba(110,76,18,.25)}
/* 席 */
.szseat{background:linear-gradient(180deg,#FFFDF7,#F8F0DE);border-color:#E3D3AE}
.szseat.act{border-color:var(--szgold);box-shadow:0 0 0 2px #E8C873,0 0 16px rgba(201,154,60,.55);animation:szact 1.8s ease-in-out infinite}
@keyframes szact{50%{box-shadow:0 0 0 2px #E8C873,0 0 26px rgba(201,154,60,.85)}}
.szturn{background:linear-gradient(180deg,#C8423F,#962B2B);box-shadow:0 2px 4px rgba(150,43,43,.4)}
/* 季節の輪：金の縁と回る光 */
.szwheel{border:0;background:radial-gradient(circle,#FFFDF6 58%,#F5E9CC 70%);box-shadow:0 0 0 3px #E8C873,0 0 0 4px #8C6420,0 0 0 9px #FBF4E2,0 0 0 10px #C99A3C,0 6px 18px rgba(110,76,18,.3)}
.szwheel::before{content:"";position:absolute;inset:-10px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 70%,rgba(255,236,170,.95) 80%,transparent 90%);-webkit-mask:radial-gradient(circle,transparent 64px,#000 65px,#000 70px,transparent 71px);mask:radial-gradient(circle,transparent 64px,#000 65px,#000 70px,transparent 71px);animation:szspin 6s linear infinite;pointer-events:none}
@keyframes szspin{to{transform:rotate(1turn)}}
.szw.on{animation:szbreath 2.2s ease-in-out infinite}
.szw.on .szart{width:36px;height:36px;filter:drop-shadow(0 0 6px color-mix(in srgb,var(--sc) 80%,transparent))}
@keyframes szbreath{50%{transform:rotate(var(--a)) translate(46px) rotate(calc(-1 * var(--a))) scale(1.12)}}
.szwc{background:radial-gradient(circle at 40% 35%,#fff,#FBF3E0);border:1px solid #D9B865;box-shadow:inset 0 0 10px rgba(201,154,60,.25)}
.szwc b{font-size:28px;text-shadow:0 0 12px color-mix(in srgb,currentColor 45%,transparent)}
.szchain i.on{background:radial-gradient(circle at 35% 35%,#F07070,#9A2222);box-shadow:0 0 6px rgba(179,58,58,.8)}
/* 場 */
.szpc{background:linear-gradient(180deg,#fff,color-mix(in srgb,var(--sc) 10%,#fff))}
.szpc.top{box-shadow:0 0 0 1.5px #D9B865,0 4px 12px color-mix(in srgb,var(--sc) 45%,transparent);transform:translateY(-3px) scale(1.06)}
.szpiles span,.szpiles button{background:linear-gradient(180deg,#FFFDF6,#F3E8CE);border-color:#D9C08A}
/* 値打ち */
.szv{background:linear-gradient(180deg,#fff,color-mix(in srgb,var(--sc) 9%,#fff));border-color:color-mix(in srgb,var(--sc) 30%,#E3D3AE)}
.szv.shun{position:relative;overflow:hidden;border-color:#C99A3C;box-shadow:0 0 0 1px #E8C873,0 0 14px rgba(201,154,60,.5);background:linear-gradient(180deg,#FFFBEA,#FBEBC0)}
.szv.shun::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.85) 48%,transparent 62%) 0 0/250% 100%;animation:szshine 3.2s linear infinite;pointer-events:none}
.szv i{background:linear-gradient(180deg,#D9AC4A,#9A7420)}
.szvt{background:linear-gradient(160deg,#3A2E26,#1E1712);color:#F7E4B0;box-shadow:inset 0 0 0 1px #8C6420,0 3px 8px rgba(0,0,0,.25)}
.szvt b{background:linear-gradient(180deg,#FFF1C4,#C99A3C);-webkit-background-clip:text;background-clip:text;color:transparent}
/* 手番・ボタン */
.szsteps span.now{border-color:#C8423F;color:#962B2B;background:linear-gradient(180deg,transparent,rgba(200,66,63,.1))}
.szguide{background:linear-gradient(90deg,rgba(255,250,235,.95),rgba(255,255,255,.6));border-left:3px solid #C99A3C}
.szb{background:linear-gradient(180deg,#FFFDF6,#F1E5C8);border-color:#8C6420;box-shadow:0 2px 0 #C9AE6E,0 3px 6px rgba(110,76,18,.18);transition:transform .1s}
.szb:active{transform:translateY(2px);box-shadow:0 0 0 #C9AE6E}
.szb.go{position:relative;overflow:hidden;background:linear-gradient(180deg,#3A2E26,#17110D);color:#F7E4B0;border-color:#C99A3C;box-shadow:0 2px 0 #6E4C12,0 0 14px rgba(201,154,60,.45)}
.szb.go::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,231,160,.35) 50%,transparent 65%) 0 0/250% 100%;animation:szshine 2.6s linear infinite}
/* 手札：金縁・箔のきらめき */
.szc{overflow:hidden;background:radial-gradient(120% 80% at 50% 0,#fff,color-mix(in srgb,var(--sc) 14%,#FFFCF4));border:1px solid #C99A3C;box-shadow:0 2px 4px rgba(43,36,32,.15),inset 0 0 0 2px #FFFDF6,inset 0 0 0 3px color-mix(in srgb,var(--sc) 55%,#E8C873);transition:transform .18s cubic-bezier(.2,1.5,.4,1),box-shadow .18s}
.szc::before{content:"";position:absolute;left:-1px;right:-1px;top:-1px;height:12px;background:linear-gradient(180deg,var(--sc),color-mix(in srgb,var(--sc) 70%,#000));-webkit-mask:radial-gradient(circle at 50% 100%,transparent 5px,#000 5.5px);mask:radial-gradient(circle at 50% 100%,transparent 5px,#000 5.5px)}
.szc::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,240,190,.75) 48%,transparent 60%) 0 0/260% 100%;opacity:0;pointer-events:none}
.szc:hover::after,.szc.sel::after{opacity:1;animation:szshine 1.6s linear infinite}
.szc .szart{width:32px;height:32px;margin-top:6px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.15))}
.szc>b{font-size:16px;text-shadow:0 1px 0 #fff}
.szcf{position:absolute;right:3px;bottom:3px;width:9px;height:9px;border-radius:1px;background:var(--sc);opacity:.8;box-shadow:0 0 0 1px #fff}
.szc.sel{transform:translateY(-9px) scale(1.06);box-shadow:0 0 0 2px #C99A3C,0 0 18px color-mix(in srgb,var(--sc) 65%,transparent),0 10px 16px rgba(43,36,32,.25)}
/* 能力カード・市場 */
.szpart{background:linear-gradient(180deg,#FFFEFA,#FAF3E3);border-color:#E3D3AE;box-shadow:0 1px 3px rgba(110,76,18,.1)}
.szpart.can{position:relative;overflow:hidden;box-shadow:0 0 0 2px #C99A3C,0 0 14px rgba(201,154,60,.5);background:linear-gradient(180deg,#FFFBEA,#FBEFCF)}
.szpart.can::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.7) 50%,transparent 65%) 0 0/250% 100%;animation:szshine 3s linear infinite;pointer-events:none}
.szmkt{padding:8px;border:1px solid #C99A3C;border-radius:4px;background:linear-gradient(180deg,rgba(255,251,236,.92),rgba(250,240,214,.92));box-shadow:inset 0 0 0 3px #FFFBEC,inset 0 0 0 4px #E3CB8C}
.szmkt h5{color:#6E4C12}
.szmon{background:radial-gradient(circle at 35% 30%,#fff,#F6EEDA)}
/* 粒（舞う花・雪など） */
#szAmb{position:fixed;inset:0;z-index:41;pointer-events:none;overflow:hidden}
#szAmb i{position:absolute;display:block;width:calc(16px * var(--z));height:calc(16px * var(--z));animation:szfall var(--d) linear var(--dl) infinite;opacity:.85}
#szAmb i svg{width:100%;height:100%;display:block}
@keyframes szfall{from{transform:translate(0,0) rotate(0)}to{transform:translate(var(--dx),112vh) rotate(var(--r))}}
#szAmb.k-spr i{opacity:.8}
#szAmb.k-aut i{width:calc(20px * var(--z));height:calc(20px * var(--z));opacity:.75}
#szAmb.k-win i{width:calc(6px * var(--z));height:calc(6px * var(--z));border-radius:50%;background:#fff;box-shadow:0 0 4px rgba(120,150,200,.8);opacity:.9}
#szAmb.k-win i.yk{width:calc(18px * var(--z));height:calc(18px * var(--z));background:none;box-shadow:none;filter:drop-shadow(0 0 2px rgba(70,103,154,.7))}
#szAmb.k-sum i{width:calc(7px * var(--z));height:calc(7px * var(--z));border-radius:50%;background:radial-gradient(circle,#FFFBD0,#D8E86A 45%,transparent 70%);box-shadow:0 0 10px 3px rgba(216,232,106,.55);animation:szfly var(--d) ease-in-out var(--dl) infinite}
@keyframes szfly{0%,100%{transform:translate(0,0);opacity:0}20%{opacity:.95}50%{transform:translate(var(--dx),-60px);opacity:.3}75%{opacity:.9}}
#szAmb.k-kin i{width:calc(10px * var(--z));height:calc(7px * var(--z));border-radius:1px;background:linear-gradient(135deg,#FFF1C4,#C99A3C 50%,#8C6420);opacity:.95;animation-duration:calc(var(--d) * .6)}
/* 大演出：季節が巡る */
.szbig{position:fixed;inset:0;z-index:48;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.szbig.adv{background:radial-gradient(circle,color-mix(in srgb,var(--sc) 25%,rgba(255,252,244,.85)) 0,rgba(255,252,244,0) 62%);animation:szbgin 2s ease both}
@keyframes szbgin{0%{opacity:0}12%,75%{opacity:1}100%{opacity:0}}
.szenso{position:absolute;width:min(70vw,300px);height:min(70vw,300px);filter:drop-shadow(0 0 10px color-mix(in srgb,var(--sc) 40%,transparent))}
.szenso path{stroke-dasharray:100;stroke-dashoffset:100;animation:szbrush .7s .05s cubic-bezier(.6,0,.3,1) forwards;opacity:.85}
@keyframes szbrush{to{stroke-dashoffset:0}}
.szbig.adv b{position:relative;font-family:var(--szmin);font-weight:900;font-size:min(34vw,150px);line-height:1;color:var(--sc);text-shadow:0 0 1px #fff,0 4px 0 color-mix(in srgb,var(--sc) 55%,#000),0 0 30px color-mix(in srgb,var(--sc) 60%,transparent);animation:szkanji 2s cubic-bezier(.2,1.4,.4,1) both}
@keyframes szkanji{0%{transform:scale(2.4);opacity:0;filter:blur(6px)}22%{transform:scale(1);opacity:1;filter:blur(0)}78%{transform:scale(1.04);opacity:1}100%{transform:scale(1.15);opacity:0}}
.szbigart{position:absolute;transform:translate(min(22vw,95px),max(-22vw,-95px));animation:szkanji 2s .12s cubic-bezier(.2,1.4,.4,1) both}
.szbigart .szart{width:64px;height:64px}
.szbig small{position:relative;margin-top:10px;font-family:var(--szmin);font-size:15px;letter-spacing:.5em;color:var(--szink,#2B2420);animation:szbgin 2s .15s ease both}
/* 大演出：「終」 */
.szbig.owari{background:radial-gradient(circle,rgba(40,10,8,.55),rgba(10,5,3,.82));animation:szbgin 2.5s ease both}
.szhan{display:grid;place-items:center;width:min(48vw,190px);height:min(48vw,190px);border:7px solid #D23A32;border-radius:14px;box-shadow:inset 0 0 0 4px rgba(0,0,0,0),inset 0 0 0 7px #D23A32,0 0 40px rgba(210,58,50,.7);background:rgba(255,240,230,.06);animation:szstamp 2.5s cubic-bezier(.3,1.6,.5,1) both}
.szhan b{font-family:var(--szmin);font-weight:900;font-size:min(32vw,128px);color:#E2453C;line-height:1;text-shadow:0 0 20px rgba(226,69,60,.8)}
@keyframes szstamp{0%{transform:scale(3) rotate(-18deg);opacity:0}16%{transform:scale(.92) rotate(-6deg);opacity:1}24%{transform:scale(1) rotate(-6deg)}80%{opacity:1}100%{opacity:0;transform:scale(1) rotate(-6deg)}}
.szbig.owari small{color:#F7D7B0;letter-spacing:.3em;font-size:16px;margin-top:16px}
.szshake{animation:szshake .5s .3s both}
@keyframes szshake{10%,50%,90%{transform:translateX(-6px)}30%,70%{transform:translateX(6px)}}
.szflash{position:fixed;inset:0;z-index:48;pointer-events:none;background:radial-gradient(circle,rgba(255,228,150,.65),rgba(201,154,60,0) 70%);animation:szflash .9s ease-out both}
@keyframes szflash{from{opacity:0}20%{opacity:1}to{opacity:0}}
/* 帯 */
.szfx{background:linear-gradient(180deg,#FFFDF6,#F5EAD0);border-color:#8C6420;box-shadow:0 0 0 3px #FFFBEC,0 0 0 4px #C99A3C,0 10px 26px rgba(0,0,0,.28)}
/* 結果：巻物と勝の落款 */
.szend{background:radial-gradient(circle at 50% 30%,rgba(90,60,20,.45),rgba(20,12,6,.8))}
.szendin{border:0;background:linear-gradient(180deg,#FFFDF6,#F6ECD6);box-shadow:0 0 0 2px #C99A3C,0 0 0 6px #FFFBEC,0 0 0 7px #8C6420,0 14px 40px rgba(0,0,0,.45);animation:szunroll .7s cubic-bezier(.2,1.2,.4,1) both}
@keyframes szunroll{from{clip-path:inset(0 0 100% 0);transform:translateY(-10px)}to{clip-path:inset(0 0 -20px 0)}}
.szendk{display:block;font-size:72px;line-height:1.05;letter-spacing:0;background:linear-gradient(180deg,#FFF1C4,#C99A3C 50%,#6E4C12);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(110,76,18,.35));animation:szkanji2 .9s .2s cubic-bezier(.2,1.5,.4,1) both}
@keyframes szkanji2{from{transform:scale(2);opacity:0}}
.szendt em{font-style:normal;font-size:18px;letter-spacing:.2em}
.szres{animation:szrin .5s cubic-bezier(.2,1.3,.4,1) both}
.szres{animation-delay:var(--dl,0s)}.szres.win{animation:szrin .5s cubic-bezier(.2,1.3,.4,1) var(--dl,0s) both,szwinglow 1.2s calc(var(--dl,0s) + .5s) ease-out both}
@keyframes szrin{from{opacity:0;transform:translateX(-18px)}}
@keyframes szwinglow{from{box-shadow:0 0 0 1px #C99A3C,0 0 50px rgba(255,210,110,1)}}
.szri li.zero{color:#B0A38A}
.szend.seen .szendin,.szend.seen .szendk,.szend.seen .szres,.szend.seen .szwin{animation:none}
/* ===== LEMNISCATE（深い夜空・金・数字ごとのネオン） ===== */
.arena.lmg{--lmbg:#070A1E;--lmink:#EAF0FF;--lmmute:#8E98C8;--lmline:rgba(160,180,255,.18);--lmgold:#FFD35A;--lmcz:"Cinzel",serif;
  padding:calc(var(--safe-t) + 8px) 10px calc(var(--safe-b) + 16px);color:var(--lmink);overflow-y:auto;overscroll-behavior:contain;gap:8px;
  background:radial-gradient(90% 50% at 80% 0,rgba(196,107,255,.22),transparent 60%),radial-gradient(80% 50% at 0 100%,rgba(94,200,255,.18),transparent 65%),
  repeating-linear-gradient(60deg,rgba(255,255,255,.025) 0 1px,transparent 1px 22px),repeating-linear-gradient(-60deg,rgba(255,255,255,.025) 0 1px,transparent 1px 22px),linear-gradient(180deg,#0B1030,#05061A)}
.lmtop{display:flex;align-items:center;gap:6px;flex:none}
.lmtop .lminf{width:42px;height:21px;flex:none;filter:drop-shadow(0 0 6px rgba(196,107,255,.7))}
.lmtop .lminf path{stroke-dasharray:100;animation:lmdash 6s linear infinite}
@keyframes lmdash{from{stroke-dashoffset:200}to{stroke-dashoffset:0}}
.lmlogo{font-family:var(--lmcz);font-weight:900;font-size:19px;letter-spacing:.14em;background:linear-gradient(100deg,#9FB4FF 0%,#FFFFFF 40%,#FFD35A 55%,#C46BFF 75%,#9FB4FF 100%) 0 0/250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:lmshine 6s linear infinite;flex:1;white-space:nowrap;overflow:hidden}
@keyframes lmshine{from{background-position:120% 0}to{background-position:-130% 0}}
.lmrd{display:flex;align-items:baseline;gap:2px;font-family:var(--lmcz);color:var(--lmgold)}
.lmrd small{font-size:8.5px;letter-spacing:.1em;color:var(--lmmute)}.lmrd b{font-size:22px;font-weight:900;text-shadow:0 0 10px rgba(255,211,90,.6)}
.lmbtn{width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,211,90,.5);background:rgba(255,255,255,.06);color:var(--lmink);font-size:15px}
.lmrbar{height:3px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;flex:none}
.lmrbar i{display:block;height:100%;background:linear-gradient(90deg,#5EC8FF,#C46BFF,#FF5A7A,#FFD35A);box-shadow:0 0 8px #C46BFF;transition:width .6s}
/* ボーナス */
.lmbonus{display:flex;align-items:center;gap:5px;flex:none;padding:6px 8px;border:1px solid rgba(255,211,90,.35);border-radius:8px;background:linear-gradient(90deg,rgba(255,211,90,.12),rgba(255,211,90,.02))}
.lmbl{font-family:var(--lmcz);font-weight:900;font-size:11px;letter-spacing:.15em;color:var(--lmgold)}
.lmbm{display:flex;flex-wrap:wrap;gap:4px;margin-left:auto}
.lmbm i{font-style:normal;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:9px;border:1px solid var(--nc);color:var(--nc);background:rgba(0,0,0,.25)}
.lmmc{display:inline-grid;place-items:center;width:22px;height:30px;border-radius:4px;border:1.5px solid var(--nc);background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(0,0,0,.3));box-shadow:0 0 8px color-mix(in srgb,var(--nc) 50%,transparent)}
.lmmc b{font-family:var(--lmcz);font-weight:900;font-size:15px;color:var(--nc)}
/* 席 */
.lmseats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;flex:none}
.lmseats.n4{grid-template-columns:repeat(2,1fr)}
.lmseat{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:6px 7px 5px;border-radius:8px;border:1px solid var(--lmline);border-left:3px solid var(--pc);background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));color:var(--lmink);text-align:left;min-width:0;line-height:1.2}
.lmseat>b{font-size:11.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lmsc{font-family:var(--lmcz);font-weight:900;font-size:20px;color:#fff;text-shadow:0 0 10px rgba(159,180,255,.5)}
.lmseat small{font-size:9px;color:var(--lmmute)}
.lmseat.act{border-color:rgba(255,211,90,.8);box-shadow:0 0 0 1px rgba(255,211,90,.6),0 0 18px rgba(255,211,90,.35);animation:lmact 1.6s ease-in-out infinite}
@keyframes lmact{50%{box-shadow:0 0 0 1px rgba(255,211,90,.9),0 0 26px rgba(255,211,90,.6)}}
.lmseat.mine{background:linear-gradient(160deg,rgba(196,107,255,.16),rgba(94,200,255,.06))}
.lmseat.tgt{border-style:dashed;border-color:#FF5A7A;animation:lmact 1s infinite}
.lmturn{position:absolute;top:-7px;right:6px;font-style:normal;font-family:var(--lmcz);font-weight:900;font-size:8px;letter-spacing:.12em;padding:1px 6px;border-radius:6px;background:var(--lmgold);color:#1A1030}
.lmsb{display:flex;flex-wrap:wrap;gap:2px;margin-top:2px;min-height:14px}
.lmsb i{font-style:normal;display:inline-grid;place-items:center;min-width:13px;height:14px;padding:0 2px;border-radius:3px;font-family:var(--lmcz);font-weight:900;font-size:9.5px;color:#0B1030;background:var(--nc)}
.lmsb i.side{transform:rotate(90deg) scale(.9);outline:1px solid #fff}
.lmsb i.more{background:rgba(255,255,255,.2);color:#fff;font-family:inherit}
.lmmons{display:flex;flex-wrap:wrap;gap:2px;margin-top:2px}
.lmplus{position:absolute;right:8px;top:18px;font-style:normal;font-family:var(--lmcz);font-weight:900;font-size:18px;color:var(--lmgold);text-shadow:0 0 10px rgba(255,211,90,.9);animation:lmplus 2.2s cubic-bezier(.2,1.4,.4,1) both;pointer-events:none}
@keyframes lmplus{0%{opacity:0;transform:translateY(10px) scale(.5)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
/* スペシャルの紋章（六角形） */
.lmsp{display:inline-grid;place-items:center;width:20px;height:22px;flex:none;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(160deg,#FFE9A8,#C9902C);position:relative}
.lmsp::before{content:"";position:absolute;inset:1.5px;clip-path:inherit;background:linear-gradient(160deg,#1B1F4A,#0B0E28)}
.lmsp b{position:relative;font-size:10.5px;font-weight:900;color:#FFE9A8;line-height:1}
.lmsp.used{opacity:.35}
.lmsp.xl{width:76px;height:86px}.lmsp.xl b{font-size:38px}
/* 山札 */
.lmpiles{display:flex;gap:6px;flex:none;flex-wrap:wrap}
.lmpiles span{font-size:10.5px;color:var(--lmmute);padding:2px 9px;border-radius:10px;border:1px solid var(--lmline);background:rgba(255,255,255,.04)}
.lmpiles b{font-family:var(--lmcz);color:#fff}
.lmpiles .seal{color:#FF9A4A;border-color:#FF9A4A}
/* 束 */
.lmmine,.lmsupply{flex:none;display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:10px;border:1px solid var(--lmline);background:rgba(255,255,255,.035)}
.lmmine h5,.lmsupply h5,.lmsheet h5{margin:0;font-family:var(--lmcz);font-weight:900;font-size:12px;letter-spacing:.12em;color:var(--lmgold);display:flex;flex-direction:column}
.lmmine h5 small,.lmsupply h5 small{font-family:var(--body);letter-spacing:0;font-weight:500;font-size:10px;color:var(--lmmute)}
.lmnote{margin:0;font-size:11px;color:var(--lmmute)}
.lmbuns{display:flex;flex-wrap:wrap;gap:8px 6px;align-items:flex-end}
.lmbun{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px;transition:transform .3s}
.lmbun .lmbs{position:relative;display:grid;place-items:center;width:34px;height:46px;border-radius:5px;border:1.5px solid var(--nc);background:linear-gradient(160deg,color-mix(in srgb,var(--nc) 30%,#151A40),#0B0E28);box-shadow:0 0 10px color-mix(in srgb,var(--nc) 40%,transparent)}
.lmbun .lmbs i{position:absolute;inset:0;border-radius:5px;border:1px solid color-mix(in srgb,var(--nc) 60%,transparent);transform:translate(calc(var(--i) * 2px),calc(var(--i) * -2px));z-index:-1;background:#0B0E28}
.lmbun .lmbs b{font-family:var(--lmcz);font-weight:900;font-size:20px;color:var(--nc);text-shadow:0 0 8px color-mix(in srgb,var(--nc) 70%,transparent)}
.lmbun em{font-style:normal;font-family:var(--lmcz);font-weight:900;font-size:12px;color:#fff}.lmbun em small{font-size:8px;color:var(--lmmute)}
.lmx{position:absolute;top:-6px;right:-6px;font-size:9px;font-weight:900;padding:0 4px;border-radius:7px;background:var(--lmgold);color:#1A1030;z-index:1}
.lmbun.side .lmbs{width:46px;height:34px}
.lmbun.fresh .lmbs{outline:2px dashed #FF5A7A;outline-offset:2px}
.lmbun.fresh em::after{content:"奪取";margin-left:3px;font-family:var(--body);font-size:8px;color:#FF5A7A}
.lmbun.fused .lmfb{display:flex;gap:2px}
.lmbun.fused .lmfb .lmbs{width:26px;height:36px}
.lmbun.fused .lmfb .lmbs b{font-size:14px}
.lmbtop{position:absolute;top:-4px;left:50%;transform:translateX(-50%);display:grid;place-items:center;min-width:30px;height:24px;padding:0 4px;border-radius:5px;background:linear-gradient(160deg,#FFE9A8,#C9902C);box-shadow:0 0 12px rgba(255,211,90,.7)}
.lmbtop b{font-family:var(--lmcz);font-weight:900;font-size:14px;color:#1A1030}
.lmbun.pick{cursor:pointer}.lmbun.pick .lmbs{animation:lmact 1.2s infinite}
.lmbun.pick.on{transform:translateY(-6px)}.lmbun.pick.on .lmbs{box-shadow:0 0 0 2px #fff,0 0 18px var(--nc)}
.lmbuns.sm .lmbun .lmbs{width:24px;height:32px}.lmbuns.sm .lmbun .lmbs b{font-size:13px}.lmbuns.sm .lmbun em{font-size:9.5px}
/* ガイド・ボタン */
.lmguide{margin:0;flex:none;font-size:12px;line-height:1.55;padding:7px 10px;border-radius:8px;background:rgba(94,200,255,.08);border-left:3px solid #5EC8FF;color:#D8E2FF}
.lmguide b{font-family:var(--lmcz);font-size:15px;color:#fff}.lmguide em{font-style:normal;color:var(--lmgold);font-weight:700}
.lmbtns{display:flex;flex-wrap:wrap;gap:6px;flex:none}
.lmb{flex:1;min-width:120px;padding:11px 8px;border-radius:10px;border:1px solid rgba(159,180,255,.45);background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.03));color:#fff;font-weight:900;font-size:13.5px;transition:transform .1s}
.lmb:active{transform:scale(.97)}
.lmb.go{position:relative;overflow:hidden;border-color:var(--lmgold);background:linear-gradient(180deg,#FFE08A,#E0A23A);color:#1A1030;box-shadow:0 0 16px rgba(255,211,90,.45)}
.lmb.go::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.6) 50%,transparent 65%) 0 0/250% 100%;animation:lmshine 2.4s linear infinite}
.lmb:disabled{opacity:.35;box-shadow:none}.lmb:disabled::after{display:none}
.lmspb{display:flex;flex-wrap:wrap;gap:6px;width:100%}
.lmb.sp{display:flex;align-items:center;justify-content:center;gap:6px;flex:1;min-width:110px;font-size:12.5px;padding:8px;border-color:rgba(255,211,90,.5);background:linear-gradient(180deg,rgba(255,211,90,.16),rgba(255,211,90,.04))}
/* 手札 */
.lmhand{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:7px;flex:none;padding-top:6px}
.lmhand.wait{opacity:.8}
.lmc{position:relative;height:80px;border-radius:8px;overflow:hidden;cursor:pointer;border:1.5px solid var(--nc);
  background:radial-gradient(120% 70% at 50% 0,color-mix(in srgb,var(--nc) 34%,#141A44),#0A0D26 75%);
  box-shadow:0 3px 8px rgba(0,0,0,.45),0 0 10px color-mix(in srgb,var(--nc) 30%,transparent),inset 0 0 0 3px rgba(10,13,38,.8),inset 0 0 0 4px color-mix(in srgb,var(--nc) 35%,transparent);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;transition:transform .2s cubic-bezier(.2,1.5,.4,1),box-shadow .2s}
.lmc>b{position:relative;z-index:1;font-family:var(--lmcz);font-weight:900;font-size:30px;line-height:1;color:var(--nc);text-shadow:0 0 12px color-mix(in srgb,var(--nc) 80%,transparent),0 2px 0 rgba(0,0,0,.6)}
.lmc .lmemb{position:absolute;inset:auto 0 4px;margin:auto;width:30px;height:30px;opacity:.85}
.lmc>b{margin-bottom:20px}
.lmcn{position:absolute;top:3px;left:5px;font-style:normal;font-family:var(--lmcz);font-weight:700;font-size:8px;color:color-mix(in srgb,var(--nc) 70%,#fff);opacity:.8;letter-spacing:.02em}
.lmcn::before{content:"×"}
.lmup{position:absolute;top:3px;right:4px;font-style:normal;font-size:8.5px;font-weight:900;padding:0 3px;border-radius:4px;background:var(--lmgold);color:#1A1030}
.lmc::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.35) 48%,transparent 60%) 0 0/260% 100%;opacity:0;pointer-events:none}
.lmc.sel{transform:translateY(-10px) scale(1.05);box-shadow:0 0 0 2px #fff,0 0 22px var(--nc),0 12px 18px rgba(0,0,0,.5)}
.lmc.sel::after{opacity:1;animation:lmshine 1.4s linear infinite}
.lmc.n8{border-color:#FFE9A8;background:radial-gradient(120% 70% at 50% 0,rgba(255,233,168,.35),#1A1030 70%),conic-gradient(from 0deg,#5EC8FF,#C46BFF,#FF5A7A,#FFD35A,#5EC8FF)}
.lmc.n8>b{background:linear-gradient(180deg,#FFFFFF,#FFD35A);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 8px rgba(255,211,90,.8))}
/* サプライ */
.lmsps{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:5px}
.lmspc{display:flex;align-items:center;gap:5px;padding:5px 6px;border-radius:8px;border:1px solid rgba(255,211,90,.3);background:rgba(255,211,90,.06);color:#fff;text-align:left}
.lmspc b{font-size:11.5px;flex:1}.lmspc small{font-size:9px;color:var(--lmmute)}
.lmspc.out{opacity:.35}.lmspc.own{border-color:var(--lmgold);box-shadow:0 0 10px rgba(255,211,90,.35)}
.lmspr{display:flex;align-items:flex-start;gap:9px;padding:8px 9px;border-radius:9px;border:1px solid rgba(255,211,90,.3);background:linear-gradient(160deg,#151A44,#0B0E28);color:#EAF0FF;text-align:left}
.lmspr .lmsp{width:30px;height:34px}.lmspr .lmsp b{font-size:15px}
.lmspr>div{flex:1;min-width:0}.lmspr b{font-size:13.5px}.lmspr p{margin:2px 0 0;font-size:11px;line-height:1.45;color:#B8C3EE}
.lmspr.used{opacity:.45}.lmspr.pick{cursor:pointer;animation:lmact 1.6s infinite}
.lmleft{font-size:10px;color:var(--lmgold);white-space:nowrap}
.lmrsp{display:flex;flex-direction:column;gap:5px}
.lmlog{list-style:none;margin:0;padding:6px 10px;border-radius:8px;background:rgba(255,255,255,.03);border:1px solid var(--lmline);font-size:10.5px;color:var(--lmmute);line-height:1.55;flex:none}
.lmloglist{list-style:none;margin:0;padding:0;font-size:12px}.lmloglist li{padding:3px 0;border-bottom:1px dotted #ccd}
.lmsheet .lmbuns{background:#0B0E28;padding:12px 8px 8px;border-radius:10px}
.lmsheet .lmbun em{color:#fff}
.lmsum{font-size:12.5px;margin:0 0 8px}
/* 選択 */
.lmask{position:fixed;inset:0;z-index:46;display:grid;place-items:center;padding:16px;background:rgba(3,4,16,.72);backdrop-filter:blur(3px)}
.lmaskin{width:min(100%,420px);max-height:86vh;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:16px 14px;border-radius:14px;border:1px solid rgba(159,180,255,.4);background:linear-gradient(170deg,#151A44,#080A22);box-shadow:0 0 40px rgba(196,107,255,.35);color:#fff;animation:lmpop .35s cubic-bezier(.2,1.4,.4,1) both}
.lmaskin.gold{border-color:var(--lmgold);box-shadow:0 0 50px rgba(255,211,90,.4)}
.lmaskin>b{font-size:14.5px;line-height:1.5;display:flex;flex-direction:column}.lmaskin>b small{font-size:11px;font-weight:500;color:var(--lmmute)}
@keyframes lmpop{from{opacity:0;transform:scale(.85)}}
.lmaskc{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.lmpick{display:flex;flex-direction:column;align-items:center;gap:4px;width:74px;background:none;border:0;color:#fff;padding:0}
.lmpick .lmc{width:64px;height:88px}
.lmpick small{font-size:10px;color:var(--lmmute)}
.lmback{display:grid;place-items:center;width:64px;height:88px;border-radius:8px;border:1.5px solid #9FB4FF;background:repeating-linear-gradient(45deg,#141A44 0 6px,#0B0E28 6px 12px)}
.lmback .lminf{width:46px}
.lmasq{display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:10px;background:rgba(255,255,255,.04)}
.lmasq>span{font-size:12px;font-weight:700;border-left:3px solid var(--pc);padding-left:6px}
/* 結果 */
.lmend{position:fixed;inset:0;z-index:45;overflow-y:auto;padding:calc(var(--safe-t) + 14px) 12px 24px;background:radial-gradient(circle at 50% 20%,rgba(196,107,255,.35),rgba(3,4,16,.92) 60%)}
.lmendin{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.lmendt{display:flex;flex-direction:column;align-items:center;gap:0;margin-bottom:6px}
.lmendt .lminf{width:160px;height:80px;filter:drop-shadow(0 0 14px rgba(196,107,255,.9))}
.lmendt .lminf path{stroke-dasharray:100;stroke-dashoffset:100;animation:lmdraw 1.4s .2s ease forwards}
@keyframes lmdraw{to{stroke-dashoffset:0}}
.lmendt b{font-family:var(--lmcz);font-weight:900;font-size:38px;letter-spacing:.25em;background:linear-gradient(180deg,#fff,#FFD35A);-webkit-background-clip:text;background-clip:text;color:transparent;animation:lmpop .8s .6s both}
.lmendt small{font-size:11px;color:var(--lmmute)}
.lmres{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;border:1px solid var(--lmline);border-left:4px solid var(--pc);background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.02));animation:lmrin .55s cubic-bezier(.2,1.3,.4,1) var(--dl,0s) both}
@keyframes lmrin{from{opacity:0;transform:translateX(-24px) scale(.96)}}
.lmres>div{flex:1;min-width:0}.lmres>div>b{font-size:14px}
.lmrk{font-family:var(--lmcz);font-weight:900;font-size:24px;width:30px;text-align:center;color:var(--lmmute)}

.wdcube.nul b{font-size:10px;color:var(--wmute);font-weight:500}
.wdcube.main{box-shadow:0 0 0 1.5px rgba(255,231,163,.35)}
.wdcube.big{width:30px;height:30px;box-shadow:0 0 18px var(--ac)}
.wdemb{position:relative;width:40px;height:40px;flex:none;color:var(--ac);display:grid;place-items:center}
.wdemb svg{position:absolute;inset:0;width:100%;height:100%}
.wdemb b{position:relative;font-family:"Dela Gothic One",sans-serif;font-size:17px;color:#fff;text-shadow:0 0 8px var(--ac)}
.wdemb .wdico.sig{position:absolute;right:-4px;bottom:-3px;width:15px;height:15px}
.wdty{font-style:normal;font-size:9px;font-weight:900;padding:1px 5px;border-radius:5px;margin-right:4px;background:rgba(255,255,255,.12)}
.wdty.t1{background:#4B5A73}.wdty.t2{background:#6A4FA0}.wdty.t3{background:linear-gradient(110deg,#B8862F,#E8C25A);color:#1A0E2E}
/* 押したとき・選べるもの */
.wdpress{transform:scale(.94)!important;filter:brightness(1.25)}
.wdpick{outline:2px solid #fff;outline-offset:1px;animation:wdpick 1s ease-in-out infinite;position:relative;z-index:2}
@keyframes wdpick{50%{outline-color:var(--wgold);box-shadow:0 0 18px var(--wgold)}}
/* 下のボタン */
.wdbar{flex:none;display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;margin:0 -8px;padding:8px 10px calc(var(--safe-b) + 8px);background:linear-gradient(0deg,rgba(11,6,24,.98) 70%,rgba(11,6,24,.6));border-top:1px solid var(--wline);min-height:62px}
.wdbar.wait{color:var(--wmute);font-size:12.5px}
.wdbar.play{justify-content:space-between;flex-wrap:nowrap}
.wdbar.play .pl{font-size:12px;line-height:1.35;min-width:0}
.wdbar .pn{color:var(--pc);filter:brightness(1.3)}
.wdbar .lbl{width:100%;text-align:center;font-size:10.5px;color:var(--wmute)}
.wdbtn{border:1px solid var(--wline);background:rgba(255,255,255,.07);color:var(--wink);border-radius:13px;padding:11px 14px;font-weight:900;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit;flex:none}
.wdbtn small{font-size:10.5px;font-weight:500;color:var(--wmute)}
.wdbtn.main{flex:1;max-width:420px;background:linear-gradient(110deg,var(--wgold),#FFB8EC 50%,#B98CFF);color:#1A0E2E;border:0;box-shadow:0 10px 26px -8px rgba(224,124,255,.7);font-size:15.5px}
.wdbtn.main small{color:#4A3460}
.wdbtn.ghost{flex:1;max-width:420px}
.wdbtn.danger{border-color:rgba(232,69,95,.6);color:#FF8FA3}
.wdbtn.armed{background:#E8455F;color:#fff;border-color:#E8455F}
.wdbtn.sm{padding:8px 12px;font-size:12.5px}
.wdbtn:disabled{opacity:.35}
.wdbtn:active,.wdface-b:active,.wdattr:active,.wdopt:active{transform:scale(.96)}
.wdface-b{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:60px;padding:6px 9px;border-radius:13px;border:1.5px solid var(--ac);background:linear-gradient(160deg,color-mix(in srgb,var(--ac) 40%,#1A0E2E),#1A0E2E);color:#fff;font-family:inherit}
.wdface-b .wdico{width:24px;height:24px}
.wdface-b b{font-size:12px}
.wdface-b small{font-size:11px;color:#8BFFB0;font-weight:900;min-height:14px}
.wdface-b i{font-style:normal;font-size:9px;color:var(--wgold)}
/* 効果の選択 */
.wdask{position:absolute;inset:auto 0 0 0;z-index:5;display:flex;justify-content:center;padding:0 8px calc(var(--safe-b) + 8px);pointer-events:none}
.wdaskin{pointer-events:auto;width:100%;max-width:480px;max-height:46vh;overflow:auto;border-radius:18px;padding:12px;background:linear-gradient(170deg,color-mix(in srgb,var(--ac) 24%,#1A0E2E),#120826 70%);border:1px solid color-mix(in srgb,var(--ac) 60%,transparent);box-shadow:0 -10px 40px rgba(0,0,0,.6);animation:wdfin .3s both}
.wdaskin>small{color:var(--wgold);font-size:11.5px;font-weight:700}
.wdaskin .tx{margin:3px 0 8px;font-size:12px;color:var(--wmute);line-height:1.5}
.wdaskin>b{display:block;font-size:14.5px;margin-bottom:7px}
.wdaskin>b em{font-style:normal;font-size:10.5px;color:var(--wmute);font-weight:500;margin-left:4px}
.wdaskin .opts{display:flex;flex-direction:column;gap:5px}
.wdopt{display:flex;align-items:center;gap:8px;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--wline);background:rgba(255,255,255,.06);color:var(--wink);font-size:13px;font-family:inherit}
@keyframes wdfin{from{opacity:0;transform:translateY(8px)}}
/* ===== 演出 ===== */
.wdfly{position:fixed;left:0;top:0;will-change:transform;z-index:3}
.wdcoin{display:block;width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFFBE6,#FFD54A 45%,#B8860B);box-shadow:0 0 8px rgba(255,215,90,.9)}
.wdcoin.red{background:radial-gradient(circle at 35% 30%,#FFE6EC,#FF6F87 45%,#A0122E);box-shadow:0 0 8px rgba(255,90,120,.9)}
.wdcoin.lv{background:radial-gradient(circle at 35% 30%,#E6FFF0,#6FFFB0 45%,#128A4E);box-shadow:0 0 8px rgba(110,255,170,.8)}
.wdflt{position:fixed;font-family:var(--wcz);font-weight:900;font-size:17px;white-space:nowrap;text-shadow:0 2px 8px rgba(0,0,0,.9);z-index:4}
.wdflt.plus{color:#8BFFB0}.wdflt.minus{color:#FF7A92}.wdflt.rob{color:#FFD23F}
.wdover{position:fixed;display:grid;place-items:center;z-index:2}
.wdover .shd{position:absolute;inset:-6px;border-radius:16px;border:2px solid #9FE3FF;background:radial-gradient(circle,rgba(159,227,255,.25),rgba(159,227,255,.05));box-shadow:0 0 22px #9FE3FF}
.wdover b{position:relative;font-size:13px;font-weight:900;padding:3px 9px;border-radius:8px;background:rgba(10,6,24,.85);white-space:nowrap}
.wdover.block b{color:#9FE3FF}
.wdover .stamp,.wdstamp{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;font-family:"Dela Gothic One";font-size:20px;color:#fff;background:radial-gradient(circle,#FF5A78,#A0122E);border:2px solid #FFD0DA;box-shadow:0 0 18px #E8455F;padding:0}
.wdover.lvup .lvb,.wdover.lvdn .lvb{font-family:var(--wcz);font-size:14px;color:#1A0E2E;background:linear-gradient(110deg,#8BFFB0,#FFE7A3);box-shadow:0 0 16px #8BFFB0}
.wdover.lvdn .lvb{background:linear-gradient(110deg,#FF8FA3,#C46BFF);color:#fff;box-shadow:0 0 16px #E8455F}
.wdover.curse .cur{color:#F2C4FF;border:1px solid #C46BFF;box-shadow:0 0 16px #C46BFF}
.wdover.die{grid-auto-flow:row;gap:4px}
.wdover.die .call{font-style:normal;font-size:12px;font-weight:900;padding:2px 8px;border-radius:7px;background:rgba(10,6,24,.85)}
.wdover.die .call.hit{color:#1A0E2E;background:var(--wgold)}
.wdover.break .shard{position:absolute;width:8px;height:8px;background:#fff;border-radius:2px;animation:wdshard .7s ease-out forwards}
.wdover.break .shard.b{animation-name:wdshard2}.wdover.break .shard.c{animation-name:wdshard3}
@keyframes wdshard{to{transform:translate(-22px,-20px) rotate(120deg);opacity:0}}
@keyframes wdshard2{to{transform:translate(20px,-24px) rotate(-140deg);opacity:0}}
@keyframes wdshard3{to{transform:translate(4px,24px) rotate(90deg);opacity:0}}
.wdhex{display:block;width:34px;height:34px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:radial-gradient(circle,#F2C4FF,#7A2AB0);box-shadow:0 0 20px #C46BFF}
.wdflycard{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 8px;border-radius:12px;background:linear-gradient(160deg,color-mix(in srgb,var(--ac) 45%,#1A0E2E),#140A28);border:1.5px solid var(--ac);box-shadow:0 0 24px var(--ac);font-size:11px;white-space:nowrap}
.wdflycard .wdemb{width:30px;height:30px}
.wdflygem{display:grid;place-items:center;width:36px;height:36px;transform:rotate(45deg);border-radius:8px;font-family:var(--wcz);font-weight:900;font-size:0;background:linear-gradient(135deg,#FFF6D6,#E8B84A);box-shadow:0 0 30px #FFE7A3,0 0 60px rgba(255,231,163,.6)}
.wdflygem.r3{background:linear-gradient(135deg,#FFE3FF,#C46BFF)}.wdflygem.r4,.wdflygem.r5{background:linear-gradient(135deg,#fff,#FF9AE0 40%,#7AC8FF)}
.wdban{position:fixed;z-index:5;text-align:center;padding:10px 6px;border-radius:14px;background:linear-gradient(90deg,transparent,rgba(12,6,26,.92) 15%,rgba(12,6,26,.92) 85%,transparent);font-size:18px;font-weight:900;line-height:1.25}
.wdban span{color:var(--pc);filter:brightness(1.35);text-shadow:0 0 14px var(--pc)}
.wdban small{display:block;font-size:12px;color:var(--wink);font-weight:700}
.wdban.round{font-family:var(--wcz);letter-spacing:.2em;color:var(--wgold)}
.wdban.round b{font-size:26px}
.wdban.face{display:flex;align-items:center;justify-content:center;gap:6px}
.wdban.face .wdico{width:26px;height:26px}
.wdban.face small{display:inline}
.wdban.tre{background:linear-gradient(90deg,transparent,rgba(60,36,8,.95) 12%,rgba(60,36,8,.95) 88%,transparent);color:var(--wgold)}
.wdban.sub{font-size:13px}
.wdcap{position:fixed;z-index:4;transform:translateY(-50%) scale(.9);opacity:0;transition:opacity .25s,transform .25s;border-radius:14px;padding:8px 10px;background:linear-gradient(160deg,color-mix(in srgb,var(--ac) 28%,#160B2C),rgba(14,6,30,.96));border:1.5px solid color-mix(in srgb,var(--ac) 70%,transparent);box-shadow:0 10px 30px rgba(0,0,0,.6),0 0 20px color-mix(in srgb,var(--ac) 35%,transparent)}
.wdcap.on{opacity:1;transform:translateY(-50%) scale(1)}
.wdcap .ch{display:flex;align-items:center;gap:7px}
.wdcap .ch .wdemb{width:32px;height:32px}
.wdcap .ch small{display:block;font-size:10px}
.wdcap .ch b{font-size:14px;display:flex;align-items:center;gap:5px}
.wdcap .ch b em{font-style:normal;font-size:11px;padding:1px 6px;border-radius:6px;background:color-mix(in srgb,var(--sc) 30%,transparent);border:1px solid var(--sc);display:inline-flex;align-items:center;gap:2px}
.wdcap .ch b em .wdico{width:12px;height:12px}
.wdcap p{margin:5px 0 0;font-size:11.5px;line-height:1.45;color:#E6DDFF}
.wdcap .res{margin-top:4px;font-size:12px;font-weight:900;color:#8BFFB0;animation:wdfin .3s both}
.wdcap .res.rob{color:#FF9AAE}
.wdcap .pn,.wdbar .pn{color:var(--pc)}
.wdhl{animation:wdhl 1s ease-in-out both;position:relative;z-index:3}
@keyframes wdhl{0%,100%{transform:none}25%{transform:scale(1.16);box-shadow:0 0 0 2px #fff,0 0 26px var(--ac,#fff)}70%{transform:scale(1.1);box-shadow:0 0 0 2px var(--wgold),0 0 20px var(--ac,#fff)}}
.wdspot{animation:wdspot 1.2s ease-in-out both}
@keyframes wdspot{30%{transform:scale(1.04);box-shadow:0 0 0 2px var(--pc),0 0 34px var(--pc)}}
.wdbump{animation:wdbump .5s ease-out}
@keyframes wdbump{40%{transform:scale(1.25)}}
.wdpopx{animation:wdpopk .6s ease-out}
@keyframes wdpopk{40%{transform:scale(1.3);filter:brightness(1.6)}}
.wdshake{animation:wdshk .45s}
@keyframes wdshk{20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.wdhurt{animation:wdhurt .9s}
@keyframes wdhurt{30%{box-shadow:0 0 0 2px #E8455F,0 0 26px #E8455F;transform:translateX(-3px)}50%{transform:translateX(3px)}}
/* ドラフト */
.wddraft h3{margin:4px 0 2px;font-family:var(--wcz);letter-spacing:.1em;text-align:center}
.wddraft>p{text-align:center;font-size:12px;color:var(--wmute);margin:0 0 10px}
.wddmine{display:flex;gap:10px;align-items:center;justify-content:center;font-size:12px;margin-bottom:10px}
.wddmine span{display:flex;align-items:center;gap:6px}
.wddcards{display:flex;flex-direction:column;gap:10px}
.wdmk.dr{border-radius:14px;align-items:stretch;text-align:left;padding:12px;display:grid;grid-template-columns:44px 1fr;grid-template-areas:"e n" "e t" "m m" "p p" "l l" "b b";gap:3px 10px;background:linear-gradient(160deg,color-mix(in srgb,var(--ac) 18%,transparent),rgba(18,8,36,.9));border:1px solid color-mix(in srgb,var(--ac) 40%,transparent)}

.wdmk.dr .lvs{grid-area:l;font-size:11px;color:var(--wmute)}
.wdmk.dr .wdbtn,.wdmk.dr .ok{grid-area:b;margin-top:6px}
.wdmk.dr .ok{font-style:normal;color:var(--wgold);font-weight:900;text-align:center}
.wdmk.dr.sel{border-color:var(--wgold);box-shadow:0 0 0 2px var(--wgold)}
.wdmk.dr.dim{opacity:.4}
.wdwait{text-align:center;font-size:12px;color:var(--wmute);padding:12px}
/* ポップアップ */
.wdpop{position:fixed;inset:0;z-index:90;background:rgba(6,2,14,.62);display:flex;align-items:flex-end;justify-content:center;padding:12px 10px calc(var(--safe-b) + 10px);color:#F2ECFF;font-family:"Zen Kaku Gothic New",sans-serif;--wgold:#FFE7A3;--wmute:#A99CC9;--wline:rgba(200,170,255,.16);--wcz:"Cinzel",serif;--wink:#F2ECFF;-webkit-user-select:none;user-select:none}
.wdpin{position:relative;width:100%;max-width:520px;max-height:86dvh;overflow-y:auto;overscroll-behavior:contain;border-radius:22px;padding:16px 14px 16px;background:linear-gradient(170deg,#24123F,#120826 60%);border:1px solid rgba(200,170,255,.25);box-shadow:0 20px 60px rgba(0,0,0,.6);animation:wdfin .22s both}
.wdx{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;border:1px solid var(--wline);background:rgba(255,255,255,.06);color:#fff;font-size:18px;z-index:2}
.wdcp-hd,.wdas-hd{display:flex;align-items:center;gap:12px;margin-bottom:8px;padding-right:38px}
.wdcp-hd .wdemb,.wdas-hd .wdemb{width:50px;height:50px}

.wdcp-hd span,.wdas-hd span{font-size:11.5px;color:var(--wmute);display:flex;align-items:center;flex-wrap:wrap}
.wdcp-desc{font-size:12.5px;line-height:1.55;margin:0 0 10px}
.wdcp-slots{display:flex;gap:14px;margin-bottom:10px}

.wdcp-lv,.wdlvtbl{display:flex;gap:4px;align-items:center;flex-wrap:wrap;font-size:11px;margin-bottom:10px}
.wdcp-lv b{font-size:11px;margin-right:4px}
.wdcp-lv span,.wdlvtbl span{padding:3px 6px;border-radius:7px;background:rgba(255,255,255,.06);font-family:var(--wcz);font-weight:900}
.wdcp-lv span small,.wdlvtbl span small{font-family:"Zen Kaku Gothic New";font-size:9px;color:var(--wmute);margin-right:3px;font-weight:500}
.wdcp-lv span.on,.wdlvtbl span.on{background:var(--wgold);color:#1A0E2E}
.wdlvtbl span.done{opacity:.45}
.wdcp-tbl{display:flex;flex-direction:column;gap:4px}
.wdcp-th{display:grid;grid-template-columns:48px 1fr 48px;font-size:10px;color:var(--wmute);padding:0 8px}
.wdeff{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:4px;padding:7px 8px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid transparent}

.wdeff .wdea em{font-style:normal;font-size:12px;font-weight:900;color:var(--ac)}
.wdeff .wdea>b{font-size:11px;color:var(--wmute)}
.wdeff p{margin:0;font-size:12px;line-height:1.45}
.wdeff .wdec{text-align:right;font-family:var(--wcz);font-weight:900;font-size:12px}
.wdeff .wdec small{font-size:8px;color:var(--wmute)}
.wdeff.sig{border-color:rgba(255,231,163,.45);background:rgba(255,231,163,.08)}

.wdeff.have{box-shadow:inset 3px 0 0 var(--ac)}
.wdcp-note{font-size:11px;color:var(--wmute);margin:8px 0 0}
.wdh5{margin:10px 0 6px;font-size:13px}
.wdh5 small{font-weight:500;color:var(--wmute);font-size:10.5px;margin-left:6px}
.wdh5.big{font-size:17px;margin-top:0}
.wdas-hd .mini{flex:none}
.wdas-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:6px 0 10px;padding:4px;border-radius:12px;background:rgba(0,0,0,.3)}

.wdas-slots{display:flex;gap:6px;margin-bottom:8px;align-items:center;flex-wrap:wrap}

.wdslotb{padding:6px 12px;border-radius:999px;border:1px solid var(--wline);background:rgba(255,255,255,.05);color:var(--wink);font-size:12px;font-family:inherit}

.wdas-attrs{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.wdattr{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 2px;border-radius:11px;border:1px solid color-mix(in srgb,var(--ac) 55%,transparent);background:linear-gradient(160deg,color-mix(in srgb,var(--ac) 25%,#1A0E2E),#160B2C);color:#fff;font-family:inherit}

.wdattr small{font-family:var(--wcz);font-weight:900;font-size:11px;color:var(--wgold)}

.wdas-pv b{font-size:12px}
.wdas-pv p{margin:2px 0 0;font-size:12px;line-height:1.45}

.wdmkb small{font-family:var(--wcz);font-weight:900;font-size:11px;color:var(--wgold)}
.wdmkb:disabled{opacity:.3}
.wdbuyb{margin:0 0 12px;padding:10px;border-radius:14px;background:linear-gradient(110deg,rgba(255,231,163,.15),rgba(224,124,255,.1));border:1px solid rgba(255,231,163,.4);padding-right:44px}

/* ---------- プレイヤー・コンピューター ---------- */
const CPU_IDS = ["cpu1", "cpu2", "cpu3", "cpu4", "cpu5", "cpu6"];
const CPU_COLORS = ["#6B7A8F", "#9A6B4F", "#4F8A6B", "#7A5C99", "#B0703A", "#3F6E9A"];
const isCpu = id => typeof id === "string" && /^cpu\d$/.test(id);

const curTrip = () => null;

function toast(msg, ms = 2200){

}
const fail = (e, what) => { console.error(e); toast(`${what}できませんでした：${(e && e.message) || e}`, 4000); };
const dmNetErr = e => /TypeError|Load failed|Failed to fetch|NetworkError|network|fetch|timeout|ECONN/i.test(String((e && (e.message || e.name)) || e));
/* プッシュ通知は今のところ使わない（ゲーム側の呼び出しはそのまま残す） */
function pushCall(){}

/* ---------- データ ---------- */
async function loadTable(t){
  if (!sb) return;
  const cl = t === "wd_games" && typeof sbWd !== "undefined" && sbWd ? sbWd : sb;
  const { data, error } = await cl.from(t).select("*");
  if (error && GAME_TBL.includes(t)){ console.warn(t, error); db[t] = db[t] || []; return; }
  if (error) throw error;
  db[t] = data || [];
  if (t === "players") db.players.sort((a, b) => (a.sort ?? 0) - (b.sort ?? 0) || String(a.created_at).localeCompare(String(b.created_at)));
}
async function loadAll(){
  const extra = typeof sbWd !== "undefined" && sbWd && sbWd !== sb ? sbWd.from("players").select("*").then(r => { db.wdPlayers = r.data || []; }, () => {}) : null;
  await Promise.all([...TABLES.map(loadTable), extra]); loaded = true;
}
const reloadTimer = {};
const GAME_HOOK = { hx_games: () => [hxId, drawHx], sz_games: () => [szId, drawSz], lm_games: () => [lmId, drawLm], wd_games: () => [wdId, drawWd] };
const inGame = () => !!(hxId || szId || lmId || wdId);
/* リアルタイムで届いた変更を反映 */
function rtChange(payload){
  const t = payload.table;
  if (!TABLES.includes(t)) return;
  if (GAME_HOOK[t] && payload.eventType === "UPDATE" && payload.new && payload.new.id && payload.new.st){
    const nw = payload.new, cur = (db[t] || []).find(x => x.id === nw.id);
    if (cur && (cur.version || 1) >= (nw.version || 1)) return;      // 自分の保存のこだま
    if (cur){ Object.assign(cur, nw); const [id, draw] = GAME_HOOK[t](); if (id === nw.id) draw(); else if (!inGame()) render(); turnBuzz(); setTimeout(cpuKick, 0); return; }
  }
  clearTimeout(reloadTimer[t]);
  reloadTimer[t] = setTimeout(async () => {
    try { await loadTable(t); if (!inGame()) render(); if (GAME_HOOK[t]) GAME_HOOK[t]()[1](); turnBuzz(); cpuKick(); } catch (e) { console.error(e); }
  }, 120);
}
function subscribe(){
  if (!sb) return;
  sb.channel("gamelab-all").on("postgres_changes", { event: "*", schema: "public" }, rtChange).subscribe();
  // WARDENS OF RELIC を別のSupabaseで動かしているとき（ボドゲOnline）
  if (typeof sbWd !== "undefined" && sbWd && sbWd !== sb) sbWd.channel("gamelab-wd").on("postgres_changes", { event: "*", schema: "public", table: "wd_games" }, rtChange).subscribe();
}

async function q(promise, what){
  const { data, error } = await promise;
  if (error){ fail(error, what); return null; }
  return data ?? true;
}
async function putSetting(key, value){ return q(sb.from("app_settings").upsert({ key, value, updated_at: new Date().toISOString() }), "保存"); }

/* ---------- 楽観的な更新：タップしたらすぐ画面を進め、保存に失敗したら元に戻す ---------- */
function optimistic(g, body, draw){
  const old = { st: g.st, version: g.version, log: g.log, status: g.status, winner: g.winner };
  Object.assign(g, body);
  try { draw(); } catch (e) { console.error(e); }
  return () => { Object.assign(g, old); };
}
/* ---------- シート ---------- */
function openSheet(title, html){

  return $("#sheetIn");
}
function closeSheet(){ $("#sheet").classList.remove("on"); }
$("#sheet").addEventListener("click", e => { if (e.target.id === "sheet") closeSheet(); });
/* ゲームの準備画面で「閉じる」を押したとき（旧アプリではゲーム一覧に戻っていた） */

const chipPlayers = (ids, selected, attr = "data-p") => `<div class="chips">${ids.map(id => `<button type="button" class="pc" style="--pc:${pcolor(id)}" ${attr}="${id}" aria-pressed="${selected.includes(id)}"><span class="dot" style="background:${pcolor(id)}"></span>${esc(pname(id))}</button>`).join("")}</div>`;
const cpuChips = order => `<details class="cpuchips" ${order.some(isCpu) ? "open" : ""}><summary>🤖 コンピューターを追加</summary><div class="chips">${CPU_IDS.map(id => `<button type="button" class="pc cpu" style="--pc:${pcolor(id)}" data-p="${id}" aria-pressed="${order.includes(id)}"><span class="dot" style="background:${pcolor(id)}"></span>${esc(pname(id))}</button>`).join("")}</div></details>`;

/* ---------- ルール ---------- */
function openGameRules(k){
  const title = { hx: "どんぐり戦争のルール", sz: "四季の巡りのルール", lm: "LEMNISCATEのルール", wd: "WARDENS OF RELICのルール" }[k];
  const html = { hx: hxRulesHtml, sz: szRulesHtml, lm: lmRulesHtml, wd: wdRulesHtml }[k]();

/* ---------- ゲーム共通の道具 ---------- */
const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
/* 同じゲームが同時に複数あるときは、自分が参加している対戦を優先 */
function pickMine(list){ return list.find(g => me && (g.players || []).includes(me)) || list[0] || null; }
/* 自分の番が回ってきたら振動させる */
const turnSeen = {};
function turnBuzz(){
  if (!me || !loaded) return;
  [...hxLive(), ...szLive(), ...lmLive(), ...wdLive()].filter(g => (g.players || []).includes(me)).forEach(g => {
    const now = g.st && g.st.wd ? wdMyTurn(g) : g.st && g.st.lm ? lmMyTurn(g) : g.st && g.st.hx ? hxMyTurn(g) : szMyTurn(g);
    const prev = turnSeen[g.id];
    turnSeen[g.id] = now;
    if (prev === false && now){ try { if (navigator.vibrate) navigator.vibrate([120, 70, 120, 70, 200]); } catch (e) {} }
  });
}
/* ログの名前をプレイヤーカラーに */
function colorizeLog(players, txt){
  const names = players.map(p => ({ p, n: esc(pname(p)) })).sort((a, b) => b.n.length - a.n.length);
  let h = esc(txt); const marks = [];
  names.forEach(({ p, n }, i) => { h = h.split(n).join(`\u0001${i}\u0002`); marks[i] = `<b class="lgn" style="--pc:${pcolor(p)}">${n}</b>`; });
  return h.replace(/\u0001(\d+)\u0002/g, (_, i) => marks[i]);
}
/* 席順・手番順のドラッグ並べ替え */
function seatDrag(box, getOrder, setOrder, redraw){
  box.querySelectorAll("[data-seat]").forEach(el => {
    el.onpointerdown = e => {
      e.preventDefault();
      const id = el.dataset.seat; el.setPointerCapture(e.pointerId); el.classList.add("drag");
      const sx = e.clientX, sy = e.clientY;
      const hit = ev => { el.style.pointerEvents = "none"; const u = document.elementFromPoint(ev.clientX, ev.clientY); el.style.pointerEvents = ""; return u && u.closest && u.closest("[data-seat]"); };
      const move = ev => { el.style.transform = `translate(${ev.clientX - sx}px, ${ev.clientY - sy}px) scale(1.08)`; const tg = hit(ev); box.querySelectorAll("[data-seat]").forEach(x => x.classList.toggle("over", x === tg && x !== el)); };
      const up = ev => {
        el.removeEventListener("pointermove", move); el.removeEventListener("pointerup", up); el.removeEventListener("pointercancel", up);
        const tg = hit(ev);
        if (tg && tg.dataset.seat !== id){ const o = getOrder().slice(), f = o.indexOf(id), to = o.indexOf(tg.dataset.seat); o.splice(f, 1); o.splice(to, 0, id); setOrder(o); if (navigator.vibrate) try { navigator.vibrate(15); } catch (e2) {} }
        redraw();
      };
      el.addEventListener("pointermove", move); el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up);
    };
  });
}
const seatHtml = order => order.map((id, i) => `<span class="nseat" data-seat="${id}" style="--pc:${pcolor(id)}"><b>${i + 1}</b>${esc(pname(id))}<em class="grip">⋮⋮</em></span>`).join("<i>→</i>");

/* ---------- コンピューター（CPU）の手番 ----------
   参加している人間の端末がCPUの一手を打つ。版番号チェックで1回分しか通らない */
const CPU_AI = {};
let cpuTimers = {};
const cpuSkipping = false;
function cpuKick(){
  if (!loaded || !me || isCpu(me)) return;
  Object.keys(CPU_AI).forEach(tb => {
    (db[tb] || []).forEach(g => {
      if (g.status !== "playing" || !(g.players || []).includes(me) || !(g.players || []).some(isCpu)) return;
      const key = tb + ":" + g.id, ver = g.version || 0;
      const cur = cpuTimers[key];
      if (cur && cur.ver === ver) return;
      if (cur) clearTimeout(cur.tm);
      let mv = null;
      try { mv = CPU_AI[tb](g); } catch (e) { console.error(e); }
      if (!mv){ delete cpuTimers[key]; return; }
      const humans = g.players.filter(x => !isCpu(x)), my = Math.max(0, humans.indexOf(me));
      const wait = (mv.wait || 1200) + my * 900 + Math.random() * 300;
      const tries0 = cur && cur.ver === -1 ? cur.tries || 0 : 0;
      cpuTimers[key] = { ver, tries: tries0, tm: setTimeout(async () => {
        const g2 = (db[tb] || []).find(x => x.id === g.id);
        if (!g2 || (g2.version || 0) !== ver || g2.status !== "playing"){ delete cpuTimers[key]; cpuKick(); return; }
        let ok = true;
        try { ok = await mv.run(); } catch (e) { console.error(e); ok = false; }
        const tries = ((cpuTimers[key] || {}).tries || 0) + 1;
        cpuTimers[key] = { ver, done: true, tries };
        const g3 = (db[tb] || []).find(x => x.id === g.id);
        if (ok === false && tries < 6 && g3 && (g3.version || 0) === ver) setTimeout(() => { const c2 = cpuTimers[key]; if (c2 && c2.ver === ver && c2.done){ cpuTimers[key] = { ver: -1, tries }; cpuKick(); } }, 2500 * tries);
        setTimeout(cpuKick, 50);
      }, wait) };
    });
  });
}

const HX_EL = { fire: { n: "炎", c: "#FF6A2A", beat: ["wind"] }, water: { n: "水", c: "#3FA9FF", beat: ["fire"] }, wind: { n: "風", c: "#52E08A", beat: ["water"] }, light: { n: "光", c: "#FFE27A", beat: ["dark"] }, dark: { n: "闇", c: "#B06BFF", beat: ["light"] } };
/* リスは4タイプ */

}
function szCharAct(st, p, k, arg){

  if (k === "back"){ const e = st.pile.pop(); st.exile.push(e.c); szL(st, `${nm}：場の一番上を取り除き、季節は${SZ_SN[szCur(st)]}に戻る`); szFx(st, { k: "unpile", p }); }
  else if (k === "takeTop"){ const e = st.pile.pop(); st.hands[p].push(e.c); szL(st, `${nm}：場の一番上を手札に（季節は${SZ_SN[szCur(st)]}に戻る）`); szFx(st, { k: "unpile", p }); }
  else if (k === "draw2"){ szL(st, `${nm}：山札から2枚引く`); szDraw(st, p, 2); }
  else if (k === "exile2"){ const got = szShuffle(st.exile).slice(0, 2); got.forEach(c => { szTake(st.exile, c); st.hands[p].push(c); }); szL(st, `${nm}：除外置き場から${got.length}枚手札に`); }
  else if (k === "refresh"){ st.mdeck.push(...st.market); st.market = []; szRefill(st, p); szL(st, `${nm}：能力カードの場を入れ替えた`); szFx(st, { k: "refresh", p }); }
  else if (k === "buy2"){ T.buyMax = (T.buyMax || 1) + 1; szL(st, `${nm}：この手番、能力カードをもう1枚買える`); }
  else if (k === "uncal"){ st.owari--; if (st.owari < 3) st.endBy = null; st.mdeck.push("owari"); st.mdeck = szShuffle(st.mdeck); szL(st, `${nm}：「終」の札を1枚、能力カードの山に戻した（${st.owari}/3）`); szFx(st, { k: "unowari", p }); }
  else if (k === "skip"){ const nx = szSeat(st, p, 1); st.skip[nx] = 1; szL(st, `${nm}：${szNm(nx)}の次の手番を飛ばす`); }
  else if (P.fam === "sek"){ const got = []; for (let i = st.deck.length - 1; i >= 0 && got.length < 2; i--) if (szSeason(st.deck[i]) === P.s){ got.push(st.deck[i]); st.deck.splice(i, 1); } st.hands[p].push(...got); st.deck = szShuffle(st.deck); szL(st, `${nm}：山札から${SZ_SN[P.s]}を${got.length}枚手札に`); }

function szAnswer(st, p, v){

    if (v){ szUse1(st, p, "ret"); szTake(st.hands[p], th.c); st.hands[th.from].push(th.c); szL(st, `「突き返し」${szNm(p)}は受け取らずに${szNm(th.from)}に返した`); szFx(st, { k: "ret", p, to: th.from, c: th.c }); }

/* ---------- 終了と得点 ---------- */
function szEnd(st, why, by){

  st.end = { why, by: by || null, last: szCur(st), res, dis: Object.fromEntries(SZ_SE.map(s => [s, szDisCount(st, s)])), at: Date.now() };
  szL(st, why === "owari" ? `「終」の札が3枚そろった（${szNm(by)}の手番）ので、ゲーム終了` : "山札が尽きたのでゲーム終了");

/* 得点：季節ごとに「場のその季節の枚数 × 手札のその季節の枚数」。旬は2倍。能力カードのボーナスを足す */
function szScore(st, p, calBy, shunOver, why){
  if (shunOver === undefined && szOnce(st, p, "shunPick")){
    let best = null; SZ_SE.forEach(s => { const r = szScore(st, p, calBy, s, why); if (!best || r.total > best.total) best = r; });
    best.items.push([`「季節読み」旬を${SZ_SN[best.shun]}として計算`, 0]); return best;
  }
  const shun = shunOver || szCur(st), mult = szHas(st, p, "shun3") ? 3 : 2, opp = szNext(szNext(shun));   // 旬からいちばん遠い季節は0点（枚数には数える）
  const cnt = Object.fromEntries(SZ_SE.map(s => [s, szCnt(st, p, s)]));
  const big = szHas(st, p, "bigSeason") ? SZ_SE.slice().sort((a, b) => cnt[b] - cnt[a])[0] : null;
  const rows = SZ_SE.map(s => {
    const d = szDisCount(st, s) + (s === big && cnt[s] ? 1 : 0) + (szHasF(st, p, "acc", s) ? 2 : 0);
    const m = s === opp ? 0 : s === shun ? mult : szHasF(st, p, "dbl", s) ? 2 : 1;
    return { s, h: cnt[s], d, m, pt: cnt[s] * d * m, opp: s === opp };
  });
  const items = [], add = (n, v) => { if (v) items.push([n, v]); };
  const sets = Math.min(...SZ_SE.map(s => cnt[s]));
  if (szHas(st, p, "sets")) add(`「一年」四季の組 ${sets}組`, sets * 3);
  if (szHas(st, p, "mostEnd") && szMost(st, p)) add("「冬籠り」手札が最多", 5);
  if (szHas(st, p, "calSelf") && calBy === p) add("「幕引き」自分の手番に3枚目の「終」", 6);
  if (szHas(st, p, "calOther")){ const n = st.pile.filter(e => e.by === p).length; add(`「働き者」場に出した${n}枚`, Math.floor(n / 2)); }
  if (szHas(st, p, "abilPts")) add(`「収集家」能力カード${st.parts[p].length}枚`, st.parts[p].length);
  if (szHas(st, p, "allFour") && sets > 0) add("「四季彩」4つの季節がそろった", 5);
  if (szHas(st, p, "minPts")){ const v = SZ_SE.map(s => cnt[s]).filter(x => x > 0); if (v.length) add("「判官贔屓」いちばん少ない季節", Math.min(...v) * 2); }
  if (szHas(st, p, "big10") && st.hands[p].length >= 10) add("「大荷物」手札10枚以上", 5);
  if (szHas(st, p, "deckEnd") && (why || (st.end && st.end.why)) === "deck") add("「天寿」山札切れで終了", 5);
  SZ_SE.forEach(s => {
    if (szHasF(st, p, "per", s)) add(`「${SZ_SN[s]}好き」${SZ_SN[s]}${cnt[s]}枚`, cnt[s]);
    if (szHasF(st, p, "wai", s) && shun === s) add(`「${SZ_SN[s]}待ち」旬が${SZ_SN[s]}`, 6);
    if (szHasF(st, p, "maj", s) && cnt[s] > 0 && st.players.every(o => szCnt(st, o, s) <= cnt[s])) add(`「${SZ_SN[s]}自慢」${SZ_SN[s]}が最多`, 4);
  });
  if (big && cnt[big]) items.push([`「偏愛」場の${SZ_SN[big]}を+1枚として計算`, 0]);
  const total = rows.reduce((s, r) => s + r.pt, 0) + items.reduce((s, x) => s + x[1], 0);

}

/* ---------- CPU ---------- */
function szPartVal(st, p, k){
  const P = SZ_PARTS[k], base = { c: 3, e: 3, o: 2 }[P.t], s = P.s;
  let v = base + (["advDraw", "stallDraw", "sets", "shun3", "mostEnd", "bigSeason"].includes(k) ? 2 : 0);
  if (s){ const c = szCnt(st, p, s); if (["per", "acc", "dbl", "maj", "hrv", "wai"].includes(P.fam)) v += c * 1.2 - 1; if (["dsc", "dsc2", "psn", "pre"].includes(P.fam)) v += c * .5; }
  return v - szCostN(k) * .6;
}
function szWantEnd(st, p){
  const mine = szScore(st, p, p).total;
  const oth = Math.max(...st.players.filter(x => x !== p).map(x => szScore(st, x, p).total));
  return mine > oth;
}
function szCpuStep(st, p){
  const a = st.ask;
  if (a && a.pid === p){
    if (a.then.t === "ret"){ const s = szSeason(a.card); return ["answer", szCnt(st, p, s) === 0 && szDisCount(st, s) <= 1]; }
    return ["answer", false];
  }
  const T = st.turn; if (!T || T.pid !== p || st.ask) return null;
  const cur = szCur(st), want = szWantEnd(st, p), h = st.hands[p];
  const sc = () => szScore(st, p, null).total;
  const gain = c => { const base = sc(); const st2 = { ...st, hands: { ...st.hands, [p]: h.filter(x => x !== c) }, pile: st.pile.concat([{ c }]) }; return szScore(st2, p, null).total - base; };
  if (T.step === "disc"){
    const once = (st.parts[p] || []).find(k => ["draw2", "exile2", "buy2"].includes(k) || ["sek", "tax"].includes(SZ_PARTS[k].fam));
    if (once && szOnceOk(st, p, once)) return ["char", once];
    if (T.bought < (T.buyMax || 1)){
      const buy = st.market.filter(k => szAfford(st, p, k)).map(k => [k, szPartVal(st, p, k)]).sort((x, y) => y[1] - x[1])[0];
      if (buy && buy[1] > 0 && h.length - szCostN(buy[0]) >= 2) return ["buy", buy[0]];
    }
    const ok = h.filter(x => szCanDisc(st, p, x));
    // 場に出す：進めると2枚・足止めで1枚引けるので、得点が大きく下がらなければ出す
    const extra = x => { const s = szSeason(x), adv = s === szNext(cur), stl = s === cur; let n = adv ? 2 : 1;
      if (adv && (szHas(st, p, "advDraw") || szHasF(st, p, "adv", s) || (szHas(st, p, "adv2") && (st.prevPlay || {})[p] === "adv"))) n++;
      if (stl && (szHas(st, p, "stallDraw") || szHasF(st, p, "stl", s) || (szHas(st, p, "stall2") && (st.prevPlay || {})[p] === "stall"))) n++;
      if (szHasF(st, p, "dsc", s)) n++; if (szHasF(st, p, "dsc2", s)) n += 2; return n; };
    const best = ok.map(x => [x, gain(x) + extra(x) * 1.2 - 1.2]).sort((x, y) => y[1] - x[1])[0];
    if (best && best[1] > 0 && T.discN < 6) return ["disc", best[0], "normal"];
    if (szOnceOk(st, p, "uncal") && !want) return ["char", "uncal"];
    if (szOnceOk(st, p, "skip") && want) return ["char", "skip"];
    return ["next"];
  }
  if (T.step === "pass"){
    const tg0 = szPassTargets(st, p); if (!tg0.length) return null;
    const tg = tg0.filter(x => x !== p).length ? tg0.filter(x => x !== p) : tg0;
    const to = tg.slice().sort((x, y) => szScore(st, x).total - szScore(st, y).total)[0];
    if (szOnce(st, p, "steal")){ const rich = tg.slice().sort((x, y) => st.hands[y].length - st.hands[x].length)[0]; if (st.hands[rich].length >= 5 && szOnceOk(st, p, "steal", rich)) return ["char", "steal", rich]; }
    let best = null, bv = -1e9;
    h.forEach(c => { const st2 = { ...st, hands: { ...st.hands, [p]: h.filter(x => x !== c) } }; let v = szScore(st2, p, null).total; if ((szHas(st, p, "passCur") && szSeason(c) === cur) || szHasF(st, p, "psn", szSeason(c))) v += 1.5; if (v > bv){ bv = v; best = c; } });
    return ["pass", best, to];
  }
  return null;
}
function szApply(st, p, mv){
  if (!mv) return false;
  const [k, a, b] = mv;
  if (k === "buy") return szBuy(st, p, a);
  if (k === "answer") return szAnswer(st, p, a);
  if (k === "disc") return szDisc(st, p, a, b || "normal");
  if (k === "pass") return szPass(st, p, a, b);
  if (k === "next") return szAdvance(st, p);
  if (k === "char") return szCharAct(st, p, a, b);
  return false;
}

/* ======================= 四季の巡り：画面（絵文字は使わず、和柄のSVGで描く） ======================= */
const szGames = () => db.sz_games || [];

const szCleaned = new Set();
function szCleanOld(){
  szGames().filter(g => g.status === "playing" && szOld(g) && !szCleaned.has(g.id)).forEach(g => {
    szCleaned.add(g.id); g.status = "aborted";
    sb.from("sz_games").update({ status: "aborted", version: (g.version || 1) + 1 }).eq("id", g.id).then(({ error }) => { if (error) console.error(error); });
  });
}
const szActive = () => pickMine(szLive());
const szById = id => szGames().find(g => g.id === id);
const szActor = st => st.ask ? st.ask.pid : st.turn ? st.turn.pid : null;
function szMyTurn(g){ const st = g && g.st; return !!(st && st.v === 5 && g.status === "playing" && me && szActor(st) === me); }
async function szCommit(id, fn){
  for (let tries = 0; tries < 6; tries++){
    const g = szById(id); if (!g || g.status !== "playing") return false;
    const st = JSON.parse(JSON.stringify(g.st)); st._log = [];
    const r = fn(st, g); if (!r) return false;
    const lines = st._log; delete st._log;
    const body = { st, version: (g.version || 1) + 1, updated_at: new Date().toISOString() };
    if (st.status !== "playing") body.status = "finished";
    if (lines.length){ const lg = (g.log || []).slice(), now = Date.now(); lines.forEach((m, i) => lg.push({ t: new Date(now + i).toISOString(), m })); body.log = lg.slice(-80); }
    const ver0 = g.version || 1, undo = optimistic(g, body, drawSz);   // 先に画面を進めてから保存する
    let data, error;
    try { ({ data, error } = await sb.from("sz_games").update(body).eq("id", id).eq("version", ver0).select()); } catch (e) { error = e; }
    if (error && dmNetErr(error) && tries < 5){ undo(); await new Promise(r2 => setTimeout(r2, 600 * (tries + 1))); await loadTable("sz_games"); continue; }
    if (error){ undo(); drawSz(); fail(error, "保存"); return false; }
    if (data && data.length){
      const before = szActor(g.st);
      Object.assign(g, data[0]); drawSz();
      const nx = szActor(st); if (nx && nx !== before && nx !== me && !isCpu(nx)) pushCall({ type: "game_turn", game: SZ_TITLE, to: nx });
      return true;
    }
    undo(); await loadTable("sz_games");
  }
  drawSz(); toast("混み合っています。もう一度タップしてください", 2000); return false;
}
const szDo = (id, p, mv) => szCommit(id, st => szApply(st, p, mv));
CPU_AI.sz_games = g => {
  const st = g.st; if (!st || st.v !== 5 || g.status !== "playing") return null;
  const p = szActor(st); if (!isCpu(p)) return null;
  const mv = szCpuStep(st, p); if (!mv) return null;
  const wait = mv[0] === "next" ? 700 : mv[0] === "buy" ? 1500 : 1300;
  return { wait, run: () => szDo(g.id, p, mv) };

  }

}

    if (!best && lmOn(st, p, "wild")){ // 万能：となりの数字（±1）を1枚足して組にする。束の価値が高いものを選ぶ
      let bv = -1;
      Object.keys(byV).map(Number).filter(v => v < 8).forEach(v => [v + 1, v - 1].forEach(w => {
        if (!byV[w] || !byV[w].length) return;
        const use = byV[v].concat([byV[w][0]]), M2 = lmMergeInfo(st, p, use); if (!M2) return;
        const val = M2.v * lmMult(st, p, M2.v) * 10 + use.length; if (val > bv){ bv = val; best = use; }

    }
    if (best && lmOn(st, p, "dbl")){ // 二連：価値の高い2組を同時に
      const top = Object.values(perV).sort((x, y) => y.val - x.val);

    }
    if (best) return ["merge", best];
  }
  // 終わり：超えた分は、ペアにならない小さい数字から捨てる
  const over = Math.max(0, h.length - LM_CAP);
  const cnt = {}; h.forEach(c => cnt[lmVal(c)] = (cnt[lmVal(c)] || 0) + 1);
  const order = h.map((c, i) => i).sort((i, j) => ((cnt[lmVal(h[i])] >= 2) - (cnt[lmVal(h[j])] >= 2)) || lmVal(h[i]) - lmVal(h[j]));
  return ["end", order.slice(0, over)];
}

async function lmCommit(id, fn){
  for (let tries = 0; tries < 6; tries++){
    const g = lmById(id); if (!g || g.status !== "playing") return false;
    const st = JSON.parse(JSON.stringify(g.st)); st._log = [];
    const r = fn(st, g); if (!r) return false;
    const lines = st._log; delete st._log;
    const body = { st, version: (g.version || 1) + 1, updated_at: new Date().toISOString() };
    if (st.status !== "playing") body.status = "finished";
    if (lines.length){ const lg = (g.log || []).slice(), now = Date.now(); lines.forEach((m, i) => lg.push({ t: new Date(now + i).toISOString(), m })); body.log = lg.slice(-100); }
    const ver0 = g.version || 1, undo = optimistic(g, body, drawLm);   // 先に画面を進めてから保存する

}

function lmEndShow(g, show){
  let host = document.getElementById("lmEndHost");
  if (!show){ if (host) host.remove(); return; }
  if (!host){ host = document.createElement("div"); host.id = "lmEndHost"; document.body.appendChild(host); }
  if (host.dataset.g === g.id && host.querySelector(".lmend")) return;   // もう表示中（描き直さない＝演出が途中で消えない）
  host.dataset.g = g.id; host.innerHTML = lmEndHtml(g);
  host.querySelector("#lmEndClose").onclick = closeLm;
  host.querySelector("#lmAgain").onclick = () => { closeLm(); openLmNew(); };
  lmEndReveal(g, host);
}
function lmEndReveal(g, el){
  const box = el.querySelector(".lmend"); if (!box) return;
  if (lmEndSeen[g.id]){ box.classList.add("seen"); return; }
  lmEndSeen[g.id] = 1;
  const rows = [...box.querySelectorAll(".lmres")];
  // 1位の前に「そして1位は…」で溜める。1位が出たら金の光を何度もはじけさせる
  const w = rows[0], wdl = w ? (parseFloat(w.style.getPropertyValue("--dl")) || 0) * 1000 : 0;
  if (w){
    setTimeout(() => { const b = document.querySelector("#lmEndHost .lmend"); if (b) b.scrollTo({ top: 0, behavior: "smooth" }); lmBig(`<p class="lmdrum">そして、1位は…</p>`, "drum", 1900); }, wdl - 2000);
    setTimeout(() => { const r = lmRect(document.querySelector("#lmEndHost .lmres.win")); lmBurstAt(r, "#FFD35A", 34, 1.6); setTimeout(() => lmBurstAt(r, "#C46BFF", 28, 1.9), 250); setTimeout(() => lmBurstAt(r, "#5EC8FF", 28, 2.2), 500); setTimeout(() => lmBurstAt(r, "#FFE9A8", 40, 2.6), 800); lmConfetti(); }, wdl + 250);
  }

  const allDl = Math.max(0, ...rows.map(r => parseFloat(r.style.getPropertyValue("--dl")) || 0));
  setTimeout(() => { const b = document.querySelector("#lmEndHost .lmend"); if (b) b.classList.add("seen"); }, allDl * 1000 + 2200);
  rows.forEach((r, i) => { const dl = parseFloat(r.style.getPropertyValue("--dl")) || 0;
    setTimeout(() => { const b = document.querySelector("#lmEndHost .lmend"), x = b && b.querySelectorAll(".lmres")[i]; if (!x) return; b.scrollTo({ top: Math.max(0, x.offsetTop - (i === 0 ? b.clientHeight * .25 : b.clientHeight * .45)), behavior: "smooth" }); }, Math.max(0, dl * 1000 - 350)); });
}
/* 金と虹色の紙吹雪 */

  d.innerHTML = Array.from({ length: 70 }, () => `<i style="left:${(Math.random() * 100).toFixed(1)}%;--c:${cols[Math.floor(Math.random() * cols.length)]};--d:${(Math.random() * .8).toFixed(2)}s;--t:${(2.4 + Math.random() * 1.8).toFixed(2)}s;--x:${((Math.random() - .5) * 160).toFixed(0)}px;--r:${(Math.random() * 900).toFixed(0)}deg"></i>`).join("");
